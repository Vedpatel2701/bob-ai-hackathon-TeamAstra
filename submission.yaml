submission:
  title: "SupplyChainAI — Agentic Supply Chain Risk & Fleet Optimization Platform"

  problem_statement: >
    Supply chain operators often lack a unified way to identify shipment
    disruption risks, understand their root causes, and make fast fleet
    allocation decisions. Delays caused by traffic, weather, congestion,
    warehouse issues, and limited vehicle availability can increase cost and
    reduce delivery reliability.

  solution_summary: >
    SupplyChainAI is an agentic AI decision-support platform that predicts
    shipment disruption risk, explains the factors behind predicted delays,
    optimizes fleet allocation, and provides actionable recommendations
    through an AI copilot. Machine learning handles prediction, explainability
    identifies important risk factors, optimization algorithms generate fleet
    assignments, and the AI agent orchestrates these capabilities.

  key_features:
    - "Shipment disruption and delay risk prediction using machine learning"
    - "Explainable root-cause analysis with feature-level risk factors"
    - "Fleet allocation optimization using constraint-based optimization"
    - "Agentic AI copilot for investigation and operational recommendations"
    - "What-if simulation for comparing disruption and fleet scenarios"

  tech_stack:
    languages:
      - "Python"
      - "TypeScript"
      - "SQL"
    frameworks:
      - "FastAPI"
      - "Next.js"
      - "React"
      - "Tailwind CSS"
      - "scikit-learn"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "PostgreSQL"
    other:
      - "Pandas"
      - "NumPy"
      - "XGBoost"
      - "SHAP"
      - "Google OR-Tools"
      - "Docker"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    The strongest aspect of the project is the combination of predictive
    machine learning, explainable AI, mathematical fleet optimization, and
    agentic AI into one operational decision-support workflow. The AI agent
    does not invent numerical predictions or vehicle assignments; it
    orchestrates specialized analytical tools and turns their outputs into
    evidence-backed recommendations.

  known_limitations: >
    The MVP uses a realistic synthetic operational dataset rather than
    proprietary live logistics data. Real-time external data feeds,
    production-scale authentication, and advanced live fleet tracking are
    outside the initial MVP scope.

